  <text x="520" y="343" fill="#00F0FF" font-family="'Consolas', monospace" font-size="12" font-weight="700">CYB-SSD-003</text>
  <text x="625" y="335" fill="#E8F1FF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Implante de Memoria SSD Neural 16TB</text>
  <text x="625" y="356" fill="#A87FFB" font-family="'Orbitron', sans-serif" font-size="10" letter-spacing="1">ALMACENAMIENTO BIO-DIGITAL</text>
  <text x="860" y="344" fill="#00FF9D" font-family="'Consolas', monospace" font-size="14" font-weight="700">$9,750.50</text>
  <!-- Badge Óptimo -->
