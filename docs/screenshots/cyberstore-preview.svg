  <rect x="36" y="182" width="380" height="546" rx="12" fill="url(#panelGrad)" stroke="#00F0FF" stroke-opacity="0.32" stroke-width="1.5"/>
  <line x1="36" y1="234" x2="416" y2="234" stroke="url(#cyanGlow)" stroke-width="1"/>

  <text x="60" y="214" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" letter-spacing="2">TERMINAL DE INGRESO // INSERT</text>

  <!-- Campo 1: SKU -->
  <text x="60" y="264" fill="#8A99AD" font-family="'Orbitron', sans-serif" font-size="11" letter-spacing="1.5">01. CÓDIGO DE SERIE (SKU) *</text>
  <rect x="60" y="274" width="332" height="40" rx="6" fill="#07090E" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>
  <text x="76" y="299" fill="#E8F1FF" font-family="'Consolas', monospace" font-size="14">CYB-NPU-009</text>

  <!-- Campo 2: Nombre del Producto -->
  <text x="60" y="340" fill="#8A99AD" font-family="'Orbitron', sans-serif" font-size="11" letter-spacing="1.5">02. NOMBRE DEL HARDWARE / GADGET *</text>
