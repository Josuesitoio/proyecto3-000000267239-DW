  <text x="472" y="276" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ID</text>
  <text x="515" y="276" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">SKU</text>
  <text x="625" y="276" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ARTÍCULO TECNOLÓGICO</text>
  <text x="860" y="276" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">PRECIO</text>
  <text x="975" y="276" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ESTADO DE STOCK</text>
  <text x="1135" y="276" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">REGISTRO</text>

