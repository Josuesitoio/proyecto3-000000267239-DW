  <rect x="456" y="388" width="768" height="74" rx="6" fill="#0B101B" stroke="#FFB800" stroke-opacity="0.35"/>
  <text x="472" y="430" fill="#8A99AD" font-family="'Consolas', monospace" font-size="13">#02</text>
  <rect x="512" y="411" width="98" height="26" rx="4" fill="#07090E" stroke="#00F0FF" stroke-opacity="0.4"/>
  <text x="520" y="429" fill="#00F0FF" font-family="'Consolas', monospace" font-size="12" font-weight="700">CYB-GPU-002</text>
  <text x="625" y="421" fill="#E8F1FF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">GPU Cuántica RTX-9090 Ti Tensor Core</text>
  <text x="625" y="442" fill="#A87FFB" font-family="'Orbitron', sans-serif" font-size="10" letter-spacing="1">PROCESAMIENTO CUÁNTICO</text>
  <text x="860" y="430" fill="#00FF9D" font-family="'Consolas', monospace" font-size="14" font-weight="700">$42,950.00</text>
  <!-- Badge Crítico -->
  <rect x="970" y="410" width="148" height="28" rx="14" fill="#2B1F04" stroke="#FFB800" stroke-width="1"/>
  <circle cx="984" cy="424" r="4" fill="#FFB800"/>
  <text x="995" y="428" fill="#FFB800" font-family="'Orbitron', sans-serif" font-size="9.5" font-weight="700">CRÍTICO // 3 UNID.</text>
  <text x="1135" y="429" fill="#8A99AD" font-family="'Consolas', monospace" font-size="11">2026-10-25</text>

  <!-- Fila 3 (Seed 1 - Óptimo) -->
  <rect x="456" y="474" width="768" height="74" rx="6" fill="#0B101B" stroke="#00F0FF" stroke-opacity="0.18"/>
  <text x="472" y="516" fill="#8A99AD" font-family="'Consolas', monospace" font-size="13">#01</text>
  <rect x="512" y="497" width="98" height="26" rx="4" fill="#07090E" stroke="#00F0FF" stroke-opacity="0.4"/>
  <text x="520" y="515" fill="#00F0FF" font-family="'Consolas', monospace" font-size="12" font-weight="700">CYB-NV-001</text>
  <text x="625" y="507" fill="#E8F1FF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Neuro-Visor de Realidad Mixta MK-IV</text>
  <text x="625" y="528" fill="#A87FFB" font-family="'Orbitron', sans-serif" font-size="10" letter-spacing="1">IMPLANTES ÓPTICOS</text>
  <text x="860" y="516" fill="#00FF9D" font-family="'Consolas', monospace" font-size="14" font-weight="700">$18,499.99</text>
  <!-- Badge Óptimo -->
  <rect x="970" y="496" width="148" height="28" rx="14" fill="#052923" stroke="#00FF9D" stroke-width="1"/>
  <circle cx="984" cy="510" r="4" fill="#00FF9D"/>
  <text x="995" y="514" fill="#00FF9D" font-family="'Orbitron', sans-serif" font-size="9.5" font-weight="700">ÓPTIMO // 12 UNID.</text>
  <text x="1135" y="515" fill="#8A99AD" font-family="'Consolas', monospace" font-size="11">2026-10-25</text>

  <!-- Leyenda Inferior de Semáforo de Stock JSTL -->
  <rect x="456" y="572" width="768" height="132" rx="8" fill="#07090E" stroke="#7000FF" stroke-opacity="0.35"/>
  <text x="478" y="600" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">TELEMETRÍA DE SEMÁFORO DE INVENTARIO (EVALUADO CON JSTL &lt;c:choose&gt; SIN SCRIPTLETS)</text>

  <rect x="478" y="618" width="225" height="66" rx="6" fill="#052923" stroke="#00FF9D" stroke-opacity="0.5"/>
  <text x="494" y="642" fill="#00FF9D" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700">STOCK ÓPTIMO (&gt; 5 UNIDADES)</text>
  <text x="494" y="664" fill="#E8F1FF" font-family="'Consolas', monospace" font-size="11">&lt;c:otherwise&gt; .badge-optimal</text>

  <rect x="722" y="618" width="235" height="66" rx="6" fill="#2B1F04" stroke="#FFB800" stroke-opacity="0.5"/>
  <text x="738" y="642" fill="#FFB800" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700">STOCK CRÍTICO (1 A 5 UNID.)</text>
  <text x="738" y="664" fill="#E8F1FF" font-family="'Consolas', monospace" font-size="11">test="${item.stock &lt;= 5}"</text>

  <rect x="976" y="618" width="228" height="66" rx="6" fill="#2D0617" stroke="#FF0055" stroke-opacity="0.5"/>
  <text x="992" y="642" fill="#FF0055" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700">AGOTADO (0 UNIDADES)</text>
  <text x="992" y="664" fill="#E8F1FF" font-family="'Consolas', monospace" font-size="11">test="${item.stock == 0}"</text>
</svg>
