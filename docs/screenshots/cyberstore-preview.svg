<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0B101B"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1420" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Fondo Espacial Neo-Futurista -->
  <rect width="1280" height="760" fill="url(#bgGrad)"/>
  <rect width="1280" height="760" fill="url(#grid)"/>

  <!-- Luces Ambientales Plasma / Cian -->
  <circle cx="180" cy="120" r="220" fill="#00F0FF" opacity="0.06"/>
  <circle cx="1080" cy="640" r="260" fill="#7000FF" opacity="0.08"/>

  <!-- HUD Header Superior -->
  <rect x="36" y="24" width="1208" height="86" rx="10" fill="url(#panelGrad)" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="36" y1="24" x2="420" y2="24" stroke="#00F0FF" stroke-width="3" filter="url(#glow)"/>

  <!-- Brand / Título -->
  <rect x="58" y="44" width="10" height="46" rx="2" fill="#00F0FF" filter="url(#glow)"/>
  <text x="82" y="64" fill="#E8F1FF" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="22" font-weight="800" letter-spacing="3">NEXUS // CYBER-STORE v4.2</text>
  <text x="82" y="86" fill="#00F0FF" font-family="'Rajdhani', 'Consolas', monospace" font-size="13" letter-spacing="2.5">SISTEMA DE INVENTARIO Y VENTA DE HARDWARE CUÁNTICO // SQLITE + JSTL 3.0</text>

  <!-- Indicadores HUD Derecha -->
  <rect x="825" y="42" width="190" height="50" rx="6" fill="#07090E" stroke="#00FF9D" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="847" cy="67" r="5" fill="#00FF9D" filter="url(#glow)"/>
  <text x="862" y="62" fill="#8A99AD" font-family="'Rajdhani', monospace" font-size="11" letter-spacing="1.5">ESTADO DE ENLACE</text>
  <text x="862" y="79" fill="#00FF9D" font-family="'Orbitron', sans-serif" font-size="12" font-weight="700" letter-spacing="1">SQLITE // ONLINE</text>

  <rect x="1030" y="42" width="192" height="50" rx="6" fill="#07090E" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1"/>
  <text x="1048" y="62" fill="#8A99AD" font-family="'Rajdhani', monospace" font-size="11" letter-spacing="1.5">NODOS DE HARDWARE</text>
  <text x="1048" y="80" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" letter-spacing="1">03 REGISTRADOS</text>

