  <rect x="60" y="426" width="332" height="40" rx="6" fill="#07090E" stroke="#7000FF" stroke-opacity="0.45" stroke-width="1"/>
  <text x="76" y="451" fill="#00F0FF" font-family="'Segoe UI', sans-serif" font-size="14">Redes Neurales</text>
  <text x="368" y="451" fill="#00F0FF" font-family="monospace" font-size="14">▼</text>

