  <circle cx="984" cy="338" r="4" fill="#00FF9D"/>
  <text x="995" y="342" fill="#00FF9D" font-family="'Orbitron', sans-serif" font-size="9.5" font-weight="700">ÓPTIMO // 25 UNID.</text>
  <text x="1135" y="343" fill="#8A99AD" font-family="'Consolas', monospace" font-size="11">2026-10-25</text>

